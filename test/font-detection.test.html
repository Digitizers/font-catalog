<title>fontRenders() regression test</title>
<!--
  Regression tests for the preview audit in ../index.html.

  fontRenders() decides whether a card may keep its live Hebrew preview. Google
  Fonts splits a family into one @font-face per subset AND per weight, each with
  its own unicode-range, so a family can load partially: Hebrew missing while
  Latin is fine, or weight 700 fine while the weight the preview actually draws
  failed. Any check coarser than "the face CSS selects for this text and weight
  is loaded" leaves a card showing Hebrew in a fallback face.

  Fixtures. The ones that must SUCCEED are self-contained data: URIs so the
  suite does not depend on the host having particular system fonts:

    Rubik Mono One   real Google font, latin + cyrillic, no Hebrew subset.
                     Stands in for "family loads, Hebrew face does not exist".
    Heebo            real full Hebrew subset. The must-not-regress case.
    Fixture Hebrew   generated TrueType face covering U+05D0-U+05EA, embedded
                     below. No unicode-range declared, so it also covers the
                     "unranged face counts as Hebrew" rule.
    Split Weight Font  weight 400 points at a 404, weight 700 at the good data
                     URI. The preview draws 400, so this must NOT qualify.
    Broken Hebrew Font  unranged, src 404s. "Hebrew face exists, network failed".
-->

</head>
<body>
<pre id="out"></pre>
<script>
// ---- kept in sync with ../index.html ----------------------------------------
const HEBREW_TEST_CODEPOINT = 0x05D0; // aleph

function parseUnicodeRange(value) {
  return value.split(',').reduce((ranges, token) => {
    const m = /^U\+([0-9A-F?]{1,6})(?:-([0-9A-F]{1,6}))?$/i.exec(token.trim());
    if (!m) return ranges;
    if (m[1].includes('?')) {
      ranges.push([
        parseInt(m[1].replace(/\?/g, '0'), 16),
        parseInt(m[1].replace(/\?/g, 'F'), 16),
      ]);
    } else {
      const lo = parseInt(m[1], 16);
      ranges.push([lo, m[2] ? parseInt(m[2], 16) : lo]);
    }
    return ranges;
  }, []);
}

const unquote = s => String(s).trim().replace(/^["\']|["\']$/g, '');

function facesFor(family) {
  const want = unquote(family).toLowerCase();
  return Array.from(document.fonts).filter(f => unquote(f.family).toLowerCase() === want);
}

const coversHebrew = face =>
  parseUnicodeRange(face.unicodeRange || 'U+0-10FFFF')
    .some(([lo, hi]) => lo <= HEBREW_TEST_CODEPOINT && HEBREW_TEST_CODEPOINT <= hi);

const PREVIEW_FONT_STYLE = `400 ${32}px`;
const HEBREW_SAMPLE = '\u05D0\u05D1\u05D2\u05D3\u05D4\u05D5\u05D6\u05D7\u05D8';

async function fontRenders(family) {
  const faces = facesFor(family);
  if (!faces.length) return false;
  if (!faces.some(coversHebrew)) return false;
  const font = `${PREVIEW_FONT_STYLE} "${unquote(family)}"`;
  try {
    await document.fonts.load(font, HEBREW_SAMPLE);
  } catch (e) {
    return false;
  }
  return document.fonts.check(font, HEBREW_SAMPLE);
}
// ---- end synced block -------------------------------------------------------

const results = [];
const check = (name, actual, expected) =>
  results.push({ name, actual, expected, ok: actual === expected });

document.fonts.ready.then(async () => {
  // Round 1: a family whose Hebrew face does not exist. Any check that answers
  // "the family loaded" rather than "Hebrew loaded" passes this.
  await document.fonts.load('72px "Rubik Mono One"', '0123456789');
  check('a family with no Hebrew subset does not qualify',
    await fontRenders('Rubik Mono One'), false);
  check('document.fonts.check() alone would have passed it (documents the bug)',
    document.fonts.check('72px "Rubik Mono One"', '\u05E9\u05DC\u05D5\u05DD'), true);

  // Round 2: the preview draws weight 400, so a loaded 700 must not rescue a
  // failed 400.
  check('a family whose previewed weight failed does not qualify, even though another weight loaded',
    await fontRenders('Split Weight Font'), false);
  // Proves the fixture is live rather than simply broken: the 700 face does
  // load, so the verdict above comes from weight selection and not from the
  // whole family failing.
  await document.fonts.load('700 32px "Split Weight Font"', HEBREW_SAMPLE).catch(() => {});
  check('  ...and its 700 face really does load, so the case is genuine',
    document.fonts.check('700 32px "Split Weight Font"', HEBREW_SAMPLE), true);

  check('a real Hebrew subset is detected', await fontRenders('Heebo'), true);
  check('an unranged face that loads qualifies', await fontRenders('Fixture Hebrew'), true);
  check('a Hebrew face whose src fails does not qualify',
    await fontRenders('Broken Hebrew Font'), false);
  check('an unknown family does not qualify',
    await fontRenders('No Such Font Family 12345'), false);

  // unicode-range parsing, including the wildcard form the grammar allows.
  const face = r => ({ unicodeRange: r });
  check('parses an interval covering Hebrew', coversHebrew(face('U+590-5FF')), true);
  check('parses an interval excluding Hebrew', coversHebrew(face('U+0-FF, U+131')), false);
  check('parses the wildcard form', coversHebrew(face('U+5??')), true);
  check('parses a single codepoint', coversHebrew(face('U+5D0')), true);
  check('treats a missing unicode-range as covering everything',
    coversHebrew({ unicodeRange: undefined }), true);

  const failed = results.filter(r => !r.ok);
  document.getElementById('out').innerHTML =
    results.map(r =>
      `<span class="${r.ok ? 'pass' : 'fail'}">${r.ok ? 'PASS' : 'FAIL'}</span>  ${r.name}` +
      (r.ok ? '' : `  (expected ${r.expected}, got ${r.actual})`)
    ).join('\n') +
    `\n\n${failed.length ? `${failed.length} FAILED` : `all ${results.length} passed`}`;
  document.title = failed.length ? `FAIL ${failed.length}` : 'PASS';
});
</script>
