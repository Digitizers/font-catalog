<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>fontRenders() regression test</title>
<!--
  Regression tests for the preview audit in ../index.html.

  fontRenders() decides whether a card may keep its live Hebrew preview. Google
  Fonts splits a family into one @font-face per subset AND per weight, each with
  its own unicode-range, so a family can load partially: Hebrew missing while
  Latin is fine, or weight 700 fine while the weight the preview draws failed.
  Any check coarser than "the face CSS selects for this text and weight is
  loaded" leaves a card showing Hebrew in a fallback face.

  EVERY core fixture is a self-contained data: URI or a local 404. The suite has
  no network dependency, because a network-dependent fixture does not merely
  risk a false failure — a negative case built on a remote font passes
  VACUOUSLY when that font cannot be fetched (no faces registered, so the
  function returns false for the wrong reason) and the suite reports green while
  testing nothing.

  The two real Google families are kept as an optional smoke check that reports
  SKIP, never PASS, when the network is unavailable — so it can never manufacture
  a green.

  Fixtures:
    Fixture Hebrew        generated TTF, U+05D0-U+05EA, no unicode-range.
                          Positive, and covers "unranged face counts as Hebrew".
    Fixture Hebrew Ranged same face with an explicit Hebrew unicode-range,
                          mirroring how Google Fonts declares its subsets.
    Fixture Latin Only    generated TTF of digits, declared with a Latin
                          unicode-range. Family exists, ships no Hebrew face.
    Split Weight Font     weight 400 -> 404, weight 700 -> good face. The
                          preview draws 400, so it must NOT qualify.
    Broken Hebrew Font    unranged, src 404s. Hebrew face exists, network failed.
-->

<body>
<pre id="out"></pre>
<script>
// ---- kept in sync with ../index.html ----------------------------------------
const HEBREW_TEST_CODEPOINT = 0x05D0; // aleph

function parseUnicodeRange(value) {
  return value.split(',').reduce((ranges, token) => {
    const m = /^U\+([0-9A-F?]{1,6})(?:-([0-9A-F]{1,6}))?$/i.exec(token.trim());
    if (!m) return ranges;
    if (m[1].includes('?')) {
      ranges.push([
        parseInt(m[1].replace(/\?/g, '0'), 16),
        parseInt(m[1].replace(/\?/g, 'F'), 16),
      ]);
    } else {
      const lo = parseInt(m[1], 16);
      ranges.push([lo, m[2] ? parseInt(m[2], 16) : lo]);
    }
    return ranges;
  }, []);
}

const unquote = s => String(s).trim().replace(/^["\']|["\']$/g, '');

function facesFor(family) {
  const want = unquote(family).toLowerCase();
  return Array.from(document.fonts).filter(f => unquote(f.family).toLowerCase() === want);
}

const coversHebrew = face =>
  parseUnicodeRange(face.unicodeRange || 'U+0-10FFFF')
    .some(([lo, hi]) => lo <= HEBREW_TEST_CODEPOINT && HEBREW_TEST_CODEPOINT <= hi);

const PREVIEW_FONT_STYLE = `400 ${32}px`;
const HEBREW_SAMPLE = '\u05D0\u05D1\u05D2\u05D3\u05D4\u05D5\u05D6\u05D7\u05D8';

async function fontRenders(family) {
  const faces = facesFor(family);
  if (!faces.length) return false;
  if (!faces.some(coversHebrew)) return false;
  const font = `${PREVIEW_FONT_STYLE} "${unquote(family)}"`;
  try {
    await document.fonts.load(font, HEBREW_SAMPLE);
  } catch (e) {
    return false;
  }
  return document.fonts.check(font, HEBREW_SAMPLE);
}
// ---- end synced block -------------------------------------------------------

const results = [];
const check = (name, actual, expected) =>
  results.push({ name, actual, expected, state: actual === expected ? 'PASS' : 'FAIL' });
const skip = (name, why) => results.push({ name: name + ' \u2014 ' + why, state: 'SKIP' });

document.fonts.ready.then(async () => {
  // --- offline-deterministic core ------------------------------------------

  // A family that exists but ships no Hebrew face. This is the round-1 defect:
  // any check answering "the family loaded" rather than "Hebrew loaded" passes.
  await document.fonts.load('400 32px "Fixture Latin Only"', '0123456789');
  check('a family with no Hebrew face does not qualify',
    await fontRenders('Fixture Latin Only'), false);
  check('  ...and its Latin face really did load, so the case is genuine',
    document.fonts.check('400 32px "Fixture Latin Only"', '0123456789'), true);
  check('document.fonts.check() alone would have passed it (documents the bug)',
    document.fonts.check('400 32px "Fixture Latin Only"', HEBREW_SAMPLE), true);

  // Round-2 defect: the preview draws weight 400, so a loaded 700 must not
  // rescue a failed 400.
  check('a family whose previewed weight failed does not qualify, even though another weight loaded',
    await fontRenders('Split Weight Font'), false);
  await document.fonts.load('700 32px "Split Weight Font"', HEBREW_SAMPLE).catch(() => {});
  check('  ...and its 700 face really does load, so the case is genuine',
    document.fonts.check('700 32px "Split Weight Font"', HEBREW_SAMPLE), true);

  check('an unranged Hebrew face that loads qualifies',
    await fontRenders('Fixture Hebrew'), true);
  check('an explicitly Hebrew-ranged face that loads qualifies',
    await fontRenders('Fixture Hebrew Ranged'), true);
  check('a Hebrew face whose src fails does not qualify',
    await fontRenders('Broken Hebrew Font'), false);
  check('an unknown family does not qualify',
    await fontRenders('No Such Font Family 12345'), false);

  // unicode-range parsing, including the wildcard form the grammar allows.
  const face = r => ({ unicodeRange: r });
  check('parses an interval covering Hebrew', coversHebrew(face('U+590-5FF')), true);
  check('parses an interval excluding Hebrew', coversHebrew(face('U+0-FF, U+131')), false);
  check('parses the wildcard form', coversHebrew(face('U+5??')), true);
  check('parses a single codepoint', coversHebrew(face('U+5D0')), true);
  check('treats a missing unicode-range as covering everything',
    coversHebrew({ unicodeRange: undefined }), true);

  // --- optional smoke check against the real Google Fonts service ----------
  // Reports SKIP rather than PASS when unreachable, so an offline run can never
  // look green on the strength of a fixture that never loaded.
  if (facesFor('Heebo').length) {
    check('[network] a real Google Hebrew subset is detected', await fontRenders('Heebo'), true);
  } else {
    skip('[network] a real Google Hebrew subset is detected', 'Google Fonts unreachable');
  }
  if (facesFor('Rubik Mono One').length) {
    check('[network] a real Google family with no Hebrew subset is refused',
      await fontRenders('Rubik Mono One'), false);
  } else {
    skip('[network] a real Google family with no Hebrew subset is refused', 'Google Fonts unreachable');
  }

  const failed = results.filter(r => r.state === 'FAIL');
  const skipped = results.filter(r => r.state === 'SKIP');
  const cls = { PASS: 'pass', FAIL: 'fail', SKIP: 'skip' };
  document.getElementById('out').innerHTML =
    results.map(r =>
      `<span class="${cls[r.state]}">${r.state}</span>  ${r.name}` +
      (r.state === 'FAIL' ? `  (expected ${r.expected}, got ${r.actual})` : '')
    ).join('\n') +
    `\n\n${failed.length ? `${failed.length} FAILED` : `all ${results.length - skipped.length} passed`}` +
    (skipped.length ? `, ${skipped.length} skipped` : '');
  document.title = failed.length ? `FAIL ${failed.length}` : 'PASS';
});
</script>
</body>
</html>
